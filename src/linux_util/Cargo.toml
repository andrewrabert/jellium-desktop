[package]
name = "jfn-linux-util"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "jfn_linux_util"
crate-type = ["rlib"]

[dependencies]
parking_lot.workspace = true

# The whole crate is `#![cfg(target_os = "linux")]`, so it's an empty rlib
# elsewhere and the workspace builds uniformly on every platform.
[target.'cfg(target_os = "linux")'.dependencies]
cursor-icon = "1"
clap = { version = "4", default-features = false, features = ["std", "derive"] }
drm-fourcc = "2"
jfn-fonts = { path = "../fonts" }
jfn-input = { path = "../input" }
jfn-mailbox = { path = "../mailbox" }
jfn-platform-abi = { path = "../platform_abi" }
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.9"
nix.workspace = true
tiny-skia = "0.12"
tracing.workspace = true
xkbcommon = "0.9"
zbus.workspace = true

[lints]
workspace = true
