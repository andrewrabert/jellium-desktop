[package]
name = "jfn-cef"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "jfn_cef"
crate-type = ["rlib"]

[dependencies]
parking_lot.workspace = true
cef = { workspace = true }
crossbeam-channel.workspace = true
crossbeam-utils.workspace = true
jfn-bringup = { path = "../bringup" }
jfn-color = { path = "../color" }
jfn-config = { path = "../config" }
jfn-gpu-paint = { path = "../gpu_paint" }
jfn-input = { path = "../input" }
jfn-jellyfin = { path = "../jellyfin" }
jfn-js-json = { path = "../js_json" }
jfn-logging = { path = "../logging" }
jfn-mpv = { path = "../mpv" }
jfn-paths = { path = "../paths" }
jfn-platform-abi = { path = "../platform_abi" }
jfn-playback = { path = "../playback" }
serde.workspace = true
serde_json.workspace = true
slotmap.workspace = true
thiserror.workspace = true

# Dup'ing CEF's dmabuf plane fds at the accelerated-paint boundary.
[target.'cfg(target_os = "linux")'.dependencies]
nix.workspace = true


[dev-dependencies]
jfn-bringup = { path = "../bringup", features = ["test-support"] }

[build-dependencies]
gix = { workspace = true }

[lints]
workspace = true
