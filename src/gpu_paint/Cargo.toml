[package]
name = "jfn-gpu-paint"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "jfn_gpu_paint"
crate-type = ["rlib"]

[dependencies]
parking_lot.workspace = true
tracing.workspace = true
thiserror.workspace = true
wgpu.workspace = true
pollster = "1.0"

# wgpu-hal is pinned to wgpu's exact build so the hal types are identical to
# the ones wgpu links; every shared-texture import reaches the backend device
# through them. One backend per platform — the same single choice the adapter
# probe makes.
[target.'cfg(target_os = "linux")'.dependencies]
nix.workspace = true
raw-window-handle = "0.6"
wgpu-hal = { version = "=29.0.4", features = ["vulkan"] }
ash = "0.38"

[target.'cfg(windows)'.dependencies]
wgpu-hal = { version = "=29.0.4", features = ["dx12"] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu-hal = { version = "=29.0.4", features = ["metal"] }
objc2.workspace = true
objc2-io-surface.workspace = true
objc2-metal.workspace = true

[dev-dependencies]
trybuild = "1"

[lints]
workspace = true
