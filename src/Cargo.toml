[workspace]
resolver = "3"
members = [
    "bringup",
    "color",
    "compositor_core",
    "config",
    "fonts",
    "gpu_paint",
    "input",
    "jellyfin",
    "jfn_cef",
    "jfn_rust",
    "js_json",
    "linux_util",
    "logging",
    "macos",
    "macos_sink",
    "mailbox",
    "mpris",
    "mpv",
    "paths",
    "platform_abi",
    "playback",
    "instance_ipc",
    "shell",
    "wake_event",
    "wayland",
    "windows",
    "windows_sink",
    "x11",
    "xtask",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
publish = false

[workspace.dependencies]
arc-swap = "1"
calloop = "0.14"
calloop-wayland-source = "0.4"
cef = { version = "=151", default-features = false }
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
gethostname = "1"
iced_graphics = { git = "https://github.com/iced-rs/iced", rev = "2cffa99b395d84fe469b44dccb56bbacd2f1a157", default-features = false }
iced_core = { git = "https://github.com/iced-rs/iced", rev = "2cffa99b395d84fe469b44dccb56bbacd2f1a157", default-features = false, features = ["advanced"] }
iced_runtime = { git = "https://github.com/iced-rs/iced", rev = "2cffa99b395d84fe469b44dccb56bbacd2f1a157", default-features = false }
iced_widget = { git = "https://github.com/iced-rs/iced", rev = "2cffa99b395d84fe469b44dccb56bbacd2f1a157", default-features = false, features = ["advanced", "canvas", "image", "wgpu"] }
iced_wgpu = { git = "https://github.com/iced-rs/iced", rev = "2cffa99b395d84fe469b44dccb56bbacd2f1a157", default-features = false, features = ["geometry", "image", "web-colors"] }
gix = { version = "0.85", default-features = false, features = ["status", "sha1"] }
interprocess = { version = "2", features = ["tokio"] }
libc = "0.2"
nix = { version = "0.30", features = ["event", "fs", "poll", "signal", "socket", "time", "uio", "user"] }
objc2 = "0.6"
parking_lot = "0.12"
objc2-app-kit = "0.3"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDate", "CFRunLoop", "CFString"] }
objc2-foundation = "0.3"
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "pwr_mgt"] }
objc2-io-surface ={ version = "0.3.2", default-features = false, features = ["std", "IOSurfaceRef", "objc2"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLAllocation", "MTLDevice", "MTLPixelFormat", "MTLResource", "MTLTexture", "objc2-io-surface"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer"] }
serde ={ version = "1", features = ["derive"] }
serde_json = "1"
slotmap = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1" }
tracing = "0.1"
wgpu = "=29.0.4"
windows = "0.62"
windows-core = "0.62"
windows-sys = "0.61"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
mem_forget = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
