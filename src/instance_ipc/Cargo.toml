[package]
name = "jfn-instance-ipc"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "jfn_instance_ipc"
crate-type = ["rlib"]

[dependencies]
jfn-paths = { path = "../paths" }
jfn-platform-abi = { path = "../platform_abi" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
interprocess.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile.workspace = true

[lints]
workspace = true
