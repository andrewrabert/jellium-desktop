name: build-macos

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Determine version
        id: version
        run: echo "version=$(dev/tools/version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          brew install \
            meson \
            ffmpeg \
            libplacebo \
            libass \
            luajit \
            vulkan-loader \
            vulkan-headers \
            molten-vk \
            sdl3 \
            libunibreak \
            zimg \
            shaderc

      # Homebrew publishes no x86_64-macOS bottle for libplacebo >= 7.387.0
      # (mpv's minimum), so the Intel runner builds it from source. Same tag
      # as the Flatpak manifest and build-macos-legacy.yml. brew's libplacebo
      # stays installed for ffmpeg; PKG_CONFIG_PATH makes mpv's meson pick
      # this one and the bundler ships both dylibs.
      - name: Cache built libplacebo (x86_64)
        if: matrix.arch == 'x86_64'
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: ~/jellyfin-deps
          key: deps-x86_64-libplacebo-v7.387.0-${{ matrix.runner }}-v1

      - name: Build libplacebo from source (x86_64)
        if: matrix.arch == 'x86_64' && steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --recursive --branch v7.387.0 https://code.videolan.org/videolan/libplacebo.git /tmp/libplacebo-src
          meson setup /tmp/libplacebo-src/build /tmp/libplacebo-src \
            --prefix="$HOME/jellyfin-deps" --buildtype=release \
            -Ddemos=false -Dtests=false -Dvulkan=enabled
          meson install -C /tmp/libplacebo-src/build --strip

      - uses: ./.github/actions/setup-cef
        with:
          platform: ${{ github.workflow }}-${{ matrix.arch }}

      - name: Build app bundle
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            export PKG_CONFIG_PATH="$HOME/jellyfin-deps/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          fi
          cargo xtask install --prefix build/output

      - name: Create DMG
        run: |
          brew install create-dmg
          APP_NAME="Jellium Desktop"
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          DMG_NAME="JelliumDesktop-${VERSION}-macos-${ARCH}.dmg"
          mkdir -p dist

          # create-dmg returns non-zero if icon positioning fails (no icon), ignore that
          create-dmg \
            --volname "Jellium Desktop v${VERSION}" \
            --no-internet-enable \
            --window-size 500 300 \
            --icon-size 100 \
            --icon "${APP_NAME}.app" 125 150 \
            --app-drop-link 375 150 \
            "dist/${DMG_NAME}" "build/output/${APP_NAME}.app" || true

          # Verify DMG was created
          if [ ! -f "dist/${DMG_NAME}" ]; then
            echo "DMG creation failed"
            exit 1
          fi
          echo "Created: dist/${DMG_NAME}"
          ls -la "dist/${DMG_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/JelliumDesktop-*.dmg
